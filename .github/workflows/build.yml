name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LEDGER_KEYSTORE_BASE64: ${{ secrets.LEDGER_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Build Performance APK
        run: gradle assemblePerformance --no-daemon

      - name: Upload Performance APK
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Performance-APK
          path: app/build/outputs/apk/performance/*.apk

      - name: Decode Release Keystore
        if: env.LEDGER_KEYSTORE_BASE64 != ''
        run: echo "$LEDGER_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build Signed Release APK
        if: env.LEDGER_KEYSTORE_BASE64 != ''
        env:
          LEDGER_KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          LEDGER_KEYSTORE_PASSWORD: ${{ secrets.LEDGER_KEYSTORE_PASSWORD }}
          LEDGER_KEY_ALIAS: ${{ secrets.LEDGER_KEY_ALIAS }}
          LEDGER_KEY_PASSWORD: ${{ secrets.LEDGER_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed Release APK
        if: env.LEDGER_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: Ledger-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish Signed GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && env.LEDGER_KEYSTORE_BASE64 != ''
        uses: softprops/action-gh-release@v2
        with:
          name: Ledger ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk